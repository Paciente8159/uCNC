###############
# Virtual MCU #
###############

[env:EMULATOR_WINDOWS]
platform = native
framework =
platform_packages = platformio/toolchain-gccmingw32
build_src_filter = 
  +<*>
  -<*.ino.cpp>
; build_src_filter = 
;   +<*>
;   +<../makefiles/virtual/>
;   -<src/tinyusb>
;   -<src/hal/mcus/avr>
;   -<../makefiles/virtual/clib>
debug_tool = native
build_type = debug
debug_build_flags = -Og -g3
; DO NOT set debug_init_cmds = run here: the init script is sourced before the
; session is attached, so the program would be started without ever stopping.
; The PlatformIO default (`tbreak main` + `run`) stops the program at main and
; allows single stepping. A specific debugger can be forced with
; `custom_win_gdb = <path to gdb>` (see uCNC/src/hal/mcus/virtual/win_gdb.py).
; Do not quote the value and use forward slashes: PlatformIO reads this option
; with Python's `configparser`, which keeps the quotes and does not unescape
; backslashes, so a quoted path is never recognised as a file.
; The emulator is a 32 bit program, so the debugger must be 32 bit as well: a
; 64 bit gdb cannot step it under WOW64 (`unknown target exception 0x4000001f`).
; Dev-Cpp's 32 bit `gdb32.exe` is used here; the `zlib1.dll` it needs but does
; not ship is rebuilt by win_gdb.py from the native toolchain.
; custom_win_gdb = Dev-Cpp/MinGW64/bin/gdb32.exe
; MinGW defaults to -mms-bitfields, which silently ignores __attribute__((packed))
; on these structs. Force the GCC layout rules so the emulator builds the same
; struct layout as the real AVR/ARM/Xtensa targets.
build_flags = ${env.build_flags} -std=gnu99 -Wall -fdata-sections -ffunction-sections -fno-exceptions -mno-ms-bitfields -Wl,--gc-sections -D MCU=MCU_VIRTUAL_WIN -D BOARD=BOARD_CUSTOM -lws2_32 -g -O0
; -D WIN_COM_NAME=COM1 -D SOCKET_PORT=34000 -lws2_32
extra_scripts =
  uCNC/src/hal/mcus/virtual/win_compiler.py
  uCNC/src/hal/mcus/virtual/win_gdb.py

[env:EMULATOR_WINDOWS_TEST]
extends = env:EMULATOR_WINDOWS
test_framework = unity
test_build_src = yes
build_flags = ${env:EMULATOR_WINDOWS.build_flags} -D PIO_UNIT_TESTING -D DISABLE_SAFE_SETTINGS -D DISABLE_ENDPROGRAM_LOCK -D EMULATE_GRBL_STARTUP=3 -O2

; Runs only the fixture that exercises the NonRT/RT startup handshake, since a
; build with the split enabled forwards every command over IPC and cannot pass
; the single core conformity fixtures. IPC_BOOT_TIMEOUT is shortened so the
; "RT side never answers" case does not stall the test run.
[env:EMULATOR_WINDOWS_IPC_TEST]
extends = env:EMULATOR_WINDOWS_TEST
test_filter = test_ipc_rt_sync
build_flags = ${env:EMULATOR_WINDOWS_TEST.build_flags} -D IPC_MODE=IPC_MULTICORE_NONRT -D IPC_BOOT_TIMEOUT=100

; Runs the split as two independent processes that talk over a pair of Windows
; named pipes (see virtual_windows.c). Each process is one side of the
; controller, so this is the two boards case - the ESP8266/AVR pair - and not
; two cores of one chip: the two do not share hardware or memory, so each is a
; one sided build that initializes and owns its own. Start them in any order,
; the RT process owns the pipes.
;
; IPC_USES_NAMED_PIPES names the transport. Defining IPC_USES_UART2 instead
; selects the link in modules/ipc_uart2.c, which is the one to use when the
; other side of the split is a real board reached over a serial port. Only one
; of the two may be defined, because either one defines the transport overrides
; declared in ipc.h.
[env:EMULATOR_WINDOWS_IPC_NONRT]
extends = env:EMULATOR_WINDOWS
build_flags = ${env:EMULATOR_WINDOWS.build_flags} -D IPC_MODE=IPC_MULTICORE_NONRT -D IPC_USES_UART2

[env:EMULATOR_WINDOWS_IPC_RT]
extends = env:EMULATOR_WINDOWS
build_flags = ${env:EMULATOR_WINDOWS.build_flags} -D IPC_MODE=IPC_MULTICORE_RT -D IPC_USES_NAMED_PIPES

[env:EMULATOR_LINUX]
platform = native
framework =
; platform_packages = platformio/linux_x86_64@^1.2.0
build_src_filter = 
  +<*>
  -<src/hal/mcus/avr>
  -<src/hal/mcus/esp32>
  -<src/hal/mcus/esp32c3>
  -<src/hal/mcus/esp32s3>
  -<src/hal/mcus/esp32common>
  -<src/hal/mcus/esp8266>
  -<src/hal/mcus/lpc176x>
  -<src/hal/mcus/rp2040>
  -<src/hal/mcus/rp2350>
  -<src/hal/mcus/stm32f0x>
  -<src/hal/mcus/stm32f1x>
  -<src/hal/mcus/stm32f4x>
  -<src/hal/mcus/stm32h7x>
;   +<../makefiles/virtual/>
;   -<src/tinyusb>
  ; -<src/hal/mcus/avr>
;   -<../makefiles/virtual/clib>
debug_tool = native
build_type = debug
debug_build_flags = -Og -g3
debug_init_cmds =
  run
build_flags = ${env.build_flags} -std=gnu99 -Wall -fdata-sections -ffunction-sections -fno-exceptions -Wl,--gc-sections -D MCU=MCU_VIRTUAL_LINUX -D BOARD=BOARD_CUSTOM -lm -g -O0
; -D WIN_COM_NAME=COM1 -D SOCKET_PORT=34000 -lws2_32
; extra_scripts = uCNC/src/hal/mcus/virtual/win_compiler.py

[env:EMULATOR_LINUX_TEST]
extends = env:EMULATOR_LINUX
test_framework = unity
test_build_src = yes
build_flags = ${env:EMULATOR_LINUX.build_flags} -D PIO_UNIT_TESTING -D DISABLE_SAFE_SETTINGS -D DISABLE_ENDPROGRAM_LOCK -D EMULATE_GRBL_STARTUP=3 -O2
